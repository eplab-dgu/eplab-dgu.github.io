<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="mapTitle mapDesc">
<title id="mapTitle">eP Lab 위치 — 동국대학교 서울캠퍼스 원흥관</title>
<desc id="mapDesc">충무로역(3·4호선)에서 동국대학교 서울캠퍼스 원흥관까지의 약도. 원흥관에 전동화 추진시스템 연구실이 있다.</desc>

<!--
  Contact 지도. 히어로 일러스트(hero.svg)와 같은 시각 언어로 그렸다:
  같은 팔레트(teal #4FBCCB·#1E8FA3, blue #214E96·#2E6FD4, amber #EFA33B, green #6FC8A2),
  얇은 선, 점선 경로 + 노드, 평면 벡터. 강조는 사이트 액센트 오렌지(#FF6A1F).

  실제 지도를 옮긴 것이 아니라 **길찾기에 필요한 것만 남긴 약도**다.
  남긴 이름: 충무로역 · 동국대학교 서울캠퍼스 · 원흥관 · 신공학관 · 본관 · 정각원.
  상점과 그 밖의 건물 이름은 전부 뺐다.

  배치 원칙(겹침 방지):
   · 3호선은 캠퍼스 **위쪽**으로 지나간다 — 관통시키면 캠퍼스 안이 지저분해진다.
   · 충무로역 라벨은 두 노선이 만나는 지점 **바로 위**의 빈 구역에 둔다.
   · 원흥관 라벨은 건물 오른쪽으로 빼서 도보 경로·다른 건물과 안 겹치게 한다.

  비율 4:3 — .contact__map .imgslot 의 aspect-ratio 와 같아 object-fit:cover 로도 안 잘린다.
  글꼴은 사이트와 같은 모노스페이스 스택. SVG 는 <img> 로 들어가 CSS 변수를 못 받으므로 직접 적는다.
-->

<defs>
  <style>
    .lbl   { font-family: Consolas, Menlo, "DejaVu Sans Mono", "Malgun Gothic", "Apple SD Gothic Neo", monospace; }
    /* Contact 슬롯에서 1200px 폭이 약 570px 로 줄어 그려진다(≈0.47배).
       화면에서 읽히려면 여기 값이 실제 필요 크기의 두 배쯤 되어야 한다. */
    .quiet { font-size: 27px; fill: #9A9AA0; }
    .stn   { font-size: 38px; fill: #EDEDED; font-weight: 700; }
    .sub   { font-size: 23px; fill: #8A8A90; }
    .lab   { font-size: 38px; fill: #FF6A1F; font-weight: 700; }
    .labsub{ font-size: 25px; fill: #FF8A4C; }
    .campus{ font-size: 30px; fill: #7FB2E8; letter-spacing: .04em; }
    .tiny  { font-size: 22px; letter-spacing: .08em; }
  </style>

  <radialGradient id="mHaze" cx="0.58" cy="0.58" r="0.66">
    <stop offset="0" stop-color="#4FBCCB" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#4FBCCB" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="labGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FF6A1F" stop-opacity="0.40"/>
    <stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/>
  </radialGradient>

  <!-- 녹지 가장자리를 뭉갠다. 딱 떨어지는 원으로 두면 공원이 아니라 도형으로 보인다. -->
  <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>

  <linearGradient id="campusFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#214E96" stop-opacity="0.32"/>
    <stop offset="1" stop-color="#143754" stop-opacity="0.18"/>
  </linearGradient>
</defs>

<!-- ── 바탕 ─────────────────────────────────────────────────────────────── -->
<rect width="1200" height="900" fill="#0E0E10"/>
<rect width="1200" height="900" fill="url(#mHaze)"/>

<!-- ── 남산 녹지 — 방향 감각만 주는 배경. 이름은 달지 않는다 ───────────── -->
<g fill="#6FC8A2" opacity="0.085" filter="url(#soften)">
  <path d="M 0 392 C 74 380, 152 398, 208 438 C 262 476, 290 534, 282 596
           C 274 662, 228 722, 158 758 C 106 784, 52 796, 0 796 Z"/>
  <path d="M 336 838 C 398 808, 476 804, 540 826 C 588 842, 616 872, 622 900
           L 300 900 C 298 874, 312 852, 336 838 Z"/>
</g>

<!-- ── 도로 (간선만, 아주 얇게) ──────────────────────────────────────────── -->
<g stroke="#2C2C31" stroke-width="9" fill="none" stroke-linecap="round">
  <path d="M 0 356 L 262 252 L 560 330 L 860 402 L 1200 478"/>  <!-- 퇴계로 축 -->
  <path d="M 372 300 L 404 500 L 436 700 L 462 900"/>           <!-- 남북 도로 -->
</g>
<g stroke="#37373D" stroke-width="3" fill="none" opacity="0.65">
  <path d="M 470 286 L 512 470"/>
  <path d="M 660 372 L 706 566 L 748 848"/>
  <path d="M 936 366 L 962 610 L 986 842"/>
  <path d="M 546 686 L 1120 742"/>
  <path d="M 540 520 L 1140 596"/>
</g>

<!-- ── 지하철 3호선 (주황) — 캠퍼스 위쪽을 지난다 ───────────────────────── -->
<path d="M 0 108 C 96 152, 190 208, 262 252 C 560 274, 880 292, 1200 316"
      fill="none" stroke="#EFA33B" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
<text class="lbl tiny" x="1178" y="286" text-anchor="end" fill="#EFA33B">3호선</text>

<!-- ── 지하철 4호선 (파랑) ──────────────────────────────────────────────── -->
<path d="M 1200 52 C 990 92, 700 152, 440 216 C 372 232, 306 244, 262 252 C 176 288, 84 336, 0 392"
      fill="none" stroke="#2E6FD4" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
<text class="lbl tiny" x="760" y="146" fill="#5C8FE0">4호선</text>

<!-- ── 충무로역 (강조) ──────────────────────────────────────────────────── -->
<g>
  <circle cx="262" cy="252" r="35" fill="#4FBCCB" opacity="0.16"/>
  <circle cx="262" cy="252" r="19" fill="#0E0E10" stroke="#EDEDED" stroke-width="5"/>
  <circle cx="262" cy="252" r="7"  fill="#EDEDED"/>
</g>
<text class="lbl stn" x="268" y="186" text-anchor="middle">충무로역</text>
<text class="lbl sub" x="196" y="262" text-anchor="end">3 · 4호선</text>

<!-- ── 도보 경로: 충무로역 → 원흥관 (히어로의 점선 + 노드 모티프) ───────── -->
<path d="M 262 252 C 340 344, 400 424, 468 480 C 520 522, 566 540, 592 548"
      fill="none" stroke="#FF6A1F" stroke-width="3.4" stroke-dasharray="10 8"
      stroke-linecap="round" opacity="0.85"/>
<circle cx="468" cy="480" r="5" fill="#FF6A1F" opacity="0.75"/>

<!-- ── 동국대학교 경계 (강조) ────────────────────────────────────────────── -->
<g>
  <path id="campus"
        d="M 560 430 L 640 372 L 812 356 L 1010 372 L 1122 424
           L 1152 520 L 1136 664 L 1078 812 L 1022 856
           L 700 862 L 604 826 L 546 720 L 528 574 Z"
        fill="url(#campusFill)"
        stroke="#4FBCCB" stroke-width="3.4" stroke-dasharray="14 9"
        stroke-linejoin="round" opacity="0.95"/>
  <use href="#campus" fill="none" stroke="#4FBCCB" stroke-width="12"
       stroke-linejoin="round" opacity="0.10"/>
</g>
<text class="lbl campus" x="880" y="412" text-anchor="middle">동국대학교 서울캠퍼스</text>

<!-- ── 남겨둔 건물 세 곳 (조용한 블록) ──────────────────────────────────── -->
<g fill="#2A3A4E" stroke="#4A5D74" stroke-width="2">
  <rect x="576" y="666" width="104" height="56" rx="5"/>   <!-- 신공학관 -->
  <rect x="770" y="592" width="96"  height="54" rx="5"/>   <!-- 본관 -->
  <rect x="906" y="716" width="92"  height="50" rx="5"/>   <!-- 정각원 -->
</g>
<g class="lbl quiet" text-anchor="middle">
  <text x="628" y="758">신공학관</text>
  <text x="818" y="682">본관</text>
  <text x="952" y="800">정각원</text>
</g>

<!-- ── 원흥관 + eP Lab (최대 강조) ──────────────────────────────────────── -->
<circle cx="662" cy="554" r="104" fill="url(#labGlow)"/>
<rect x="606" y="522" width="112" height="64" rx="6"
      fill="#FF6A1F" stroke="#FFB183" stroke-width="3"/>
<g stroke="#0E0E10" stroke-width="2.4" opacity="0.45">
  <line x1="634" y1="522" x2="634" y2="586"/>
  <line x1="662" y1="522" x2="662" y2="586"/>
  <line x1="690" y1="522" x2="690" y2="586"/>
</g>

<!-- 라벨은 건물 **위**에 가운데 맞춤. 오른쪽에 두면 긴 영문이 캠퍼스 경계를 넘어
     그림 오른쪽 끝까지 닿는다. 위쪽은 캠퍼스 안 빈 공간이라 여유가 있다. -->
<line x1="700" y1="520" x2="742" y2="506" stroke="#FF6A1F" stroke-width="2.4" opacity="0.8"/>
<text class="lbl lab"    x="762" y="470" text-anchor="middle">원흥관 E142</text>
<text class="lbl labsub" x="762" y="500" text-anchor="middle">electrified Propulsion Lab.</text>

<!-- ── 범례 ─────────────────────────────────────────────────────────────── -->
<g transform="translate(64,846)">
  <line x1="0" y1="0" x2="34" y2="0" stroke="#FF6A1F" stroke-width="3.4"
        stroke-dasharray="10 8" stroke-linecap="round"/>
  <text class="lbl tiny" x="46" y="5" fill="#8A8A90">충무로역에서 도보 약 10분</text>
</g>
</svg>
