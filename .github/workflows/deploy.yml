# eP Lab 홈페이지 — 빌드 & GitHub Pages 배포
#
# 언제 도는가
#   - push       : main/master 에 코드가 올라갈 때
#   - schedule   : 30분마다 (시트를 고쳐도 저절로 반영되게 하는 유일한 장치)
#   - dispatch   : Actions 탭에서 수동 실행 — 시트 고치고 바로 반영하고 싶을 때
#
# 시트 편집이 "즉시" 게시되지는 않는다. 빌드 방식이라 트리거가 필요하다(CLAUDE.md §3).
# 급하면 수동 실행(Run workflow)이 가장 빠르다.
name: Deploy

on:
  push:
    branches: [main, master]
  schedule:
    # 30분마다. GitHub 의 예약 실행은 혼잡하면 수 분~수십 분 밀리고 가끔 건너뛴다.
    # "정확히 30분"을 보장하지 않는다 — 급한 반영은 수동 실행을 쓸 것.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 새 실행이 오면 진행 중인 것을 취소하지 않고 줄을 세운다
# (취소하면 절반만 올라간 상태가 남을 수 있다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # xlsx 는 npm 레지스트리가 아니라 cdn.sheetjs.com 에서 받는다(package.json 참고).
      # lock 파일에 integrity 가 있어 npm ci 로 재현 가능하게 설치된다.
      - run: npm ci

      # 내려받은 이미지를 실행 간에 재사용한다. 이게 없으면 30분마다 구글 드라이브에
      # 사진을 새로 받아 하루 수백 번 요청하게 되고, 드라이브 쪽 제한에 걸릴 수 있다.
      #
      # 키의 v2 는 **캐시를 한 번 버리려고** 붙였다. 캐시 파일명은 URL 해시라서,
      # 변환 규칙을 바꿔도 예전에 받아둔 PNG 가 "이미 있다"로 그냥 재사용된다.
      # 인코딩 방식을 또 바꾸면 이 번호를 올려야 새로 만들어진다.
      - name: Restore asset cache
        uses: actions/cache@v4
        with:
          path: asset-cache
          key: asset-cache-v2-${{ github.run_id }}
          restore-keys: asset-cache-v2-

      - uses: actions/configure-pages@v5

      - name: Build
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run build 2>&1 | tee build.log

      # 빌드(eleventy)는 어떤 경우에도 성공한다 — 로컬 작업이 데이터 문제로 멈추지 않게
      # 일부러 그렇게 설계했다. 그래서 "빌드 초록불"은 "내용이 멀쩡하다"는 뜻이 아니다.
      #
      # **배포 여부는 여기서 정한다.** 시트를 못 읽었으면 올리지 않고 실패시킨다.
      # 저장소에 시트 사본을 두지 않기로 했으므로(2026-09-06), 못 읽은 빌드는
      # 옛 내용이 아니라 **텅 빈 사이트**가 된다. 그걸 배포하면 홈페이지가 지워진다.
      # 여기서 멈추면 GitHub Pages 가 직전 배포본을 계속 서빙한다 = 진짜 fail-safe.
      - name: Check which source the build used
        run: |
          if [ ! -s _site/index.html ]; then
            echo "::error::빌드 산출물이 없다"; exit 1
          fi
          echo "산출된 페이지: $(find _site -name '*.html' | wc -l)개"

          SOURCE=$(grep -o 'source=[a-z-]*' build.log | tail -1 | cut -d= -f2)
          echo "데이터 소스: ${SOURCE:-알 수 없음}"
          case "$SOURCE" in
            sheets-api)
              echo "시트에서 직접 읽었다 — 최신 내용이다." ;;
            cache-fallback|cache)
              echo "::error::시트를 못 읽어 로컬 캐시로 빌드했다. 배포하지 않는다(직전 배포본 유지). 서비스 계정 키 만료·시트 공유 해제·API 장애를 확인할 것."; exit 1 ;;
            xlsx)
              echo "::error::시크릿(SHEET_ID / GOOGLE_SERVICE_ACCOUNT_JSON)을 읽지 못했다. 배포하지 않는다(직전 배포본 유지). Settings > Secrets 를 확인할 것."; exit 1 ;;
            none|'')
              echo "::error::데이터를 전혀 읽지 못했다. 배포하지 않는다(직전 배포본 유지)."; exit 1 ;;
            *)
              echo "::error::알 수 없는 데이터 소스($SOURCE). 안전을 위해 배포하지 않는다."; exit 1 ;;
          esac

          # 내용이 통째로 빈 채 배포되는 것도 막는다 (시트는 읽었는데 탭이 비었거나
          # 권한이 바뀌어 빈 응답이 온 경우). 사람 수는 항상 1명 이상이어야 한다.
          PEOPLE=$(grep -c 'class="person"' _site/team/researchers/index.html || true)
          if [ "${PEOPLE:-0}" -lt 1 ]; then
            echo "::error::구성원이 0명으로 나왔다 — 데이터가 비어 있다. 배포하지 않는다."; exit 1
          fi
          echo "구성원 카드: ${PEOPLE}개 — 내용 있음"

          # 스킵된 행이 있으면 눈에 띄게 남긴다 (시트에 잘못 입력된 행).
          # 이건 경고까지만 — 한 행이 잘못됐다고 전체 배포를 막지는 않는다.
          grep -E '\[cms\].*(!!|SKIPPED)' build.log | while read -r line; do
            echo "::warning::$line"
          done || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
