# 폴백 캐시 갱신 (data-cache/)
#
# 왜 따로 도는가: `data-cache/` 는 **시트 API 가 죽은 날 쓰는 비상용 사본**이다.
# 지금까지는 로컬에서 `npm run cache:refresh` 를 수동으로 돌려야 했고, 그걸 빠뜨리면
# 정작 장애가 났을 때 몇 달 전 내용이 배포된다 (CLAUDE.md 기술 부채 항목).
#
# 배포 워크플로에 끼워 넣지 않고 분리한 이유: 배포는 자주(30분) 돌아야 하지만
# 캐시 커밋은 드물어야 한다. 매 배포마다 커밋하면 히스토리가 커밋으로 뒤덮인다.
#
# 커밋이 생기면 push 트리거로 Deploy 가 한 번 더 돈다 — 의도된 동작이다(갱신된 캐시 반영).
# 이 워크플로 자체는 push 로 돌지 않으므로 무한 루프는 생기지 않는다.
name: Refresh fallback cache

on:
  schedule:
    - cron: '17 3 * * 1' # 매주 월요일 03:17 UTC (한국 시간 월요일 정오쯤)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh cache from the sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run cache:refresh

      - name: Commit if changed
        run: |
          # _manifest.json 은 실행할 때마다 타임스탬프가 바뀐다. 그것만 바뀌었으면
          # 내용은 그대로라는 뜻이므로 커밋하지 않는다 — 빈 커밋이 매주 쌓이는 걸 막는다.
          if git diff --quiet -- data-cache ':!data-cache/_manifest.json'; then
            echo "내용 변화 없음 — 커밋하지 않는다"
            git checkout -- data-cache
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-cache
          git commit -m "폴백 캐시 갱신 (자동)"
          git push
